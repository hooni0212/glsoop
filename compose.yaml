services:
  app:
    build:
      context: .
    image: glsoop-server:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /app/data/live/users.db
      PROFILE_PHOTO_UPLOAD_DIR: /app/public/uploads/profile-photos
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/live:/app/data/live
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/readyz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
