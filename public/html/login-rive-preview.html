<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 Rive 전체화면 시안 | 글숲</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap"
    rel="stylesheet"
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap"
    rel="stylesheet"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-login-preview">
  <main class="login-preview-screen" aria-label="Rive 로그인 미리보기 화면">
    <canvas
      id="loginPreviewRiveCanvas"
      class="login-preview-canvas"
      data-rive-src="/rive/glsoop_login.riv"
      width="1920"
      height="1080"
      aria-hidden="true"
    ></canvas>

    <div class="login-preview-backdrop" aria-hidden="true"></div>

    <section class="login-preview-card gls-antique-paper gls-antique-paper--mix" aria-labelledby="loginPreviewTitle">
      <header class="login-preview-card__head">
        <div class="login-preview-card__brand-row">
          <a href="/index.html" class="login-preview-card__brand" aria-label="홈으로 이동">글숲</a>
          <p class="login-preview-card__eyebrow gls-mb-0">SIGN IN</p>
        </div>
        <h1 id="loginPreviewTitle" class="gls-mb-2">다시 돌아오신 걸 환영해요</h1>
        <p class="gls-mb-0 login-preview-card__copy">전체 배경 모션 위 로그인 카드 오버레이 시안입니다.</p>
      </header>

      <form id="loginPreviewForm" class="login-preview-form" novalidate>
        <div class="gls-mb-3 auth-field">
          <label class="gls-label" for="previewEmail">이메일</label>
          <input
            id="previewEmail"
            type="email"
            name="email"
            class="gls-input"
            required
            autocomplete="email"
            placeholder="name@example.com"
          >
        </div>

        <div class="gls-mb-3 auth-field">
          <label class="gls-label" for="previewPw">비밀번호</label>
          <input
            id="previewPw"
            type="password"
            name="pw"
            class="gls-input"
            required
            autocomplete="current-password"
            placeholder="비밀번호를 입력하세요"
          >
        </div>

        <button type="submit" class="gls-btn gls-btn-primary gls-btn-block">로그인</button>

        <div
          id="loginPreviewMessage"
          class="gls-feedback gls-feedback--info gls-mt-3"
          role="status"
          aria-live="polite"
        ></div>

        <div class="login-preview-links gls-mt-3">
          <a href="/html/forgot-password.html" class="auth-link-inline">비밀번호 찾기</a>
          <a href="/html/signup.html" class="auth-link-inline">회원가입</a>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.31.6"></script>
  <script src="/js/login-rive-preview.js"></script>
</body>
</html>
