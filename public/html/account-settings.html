<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계정 설정 | 글숲</title>

  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/themes/spring-theme.css">
  <link rel="stylesheet" href="/css/themes/summer-theme.css">
  <link rel="stylesheet" href="/css/themes/autumn-theme.css">
  <link rel="stylesheet" href="/css/themes/winter-theme.css">
</head>
<body class="winter-theme">
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top nav-height">
    <div class="container">
      <a class="navbar-brand" href="/index.html">글숲</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto before-login">
          <li class="nav-item"><a class="nav-link" href="/html/login.html">로그인</a></li>
          <li class="nav-item"><a class="nav-link" href="/html/signup.html">회원가입</a></li>
        </ul>
        <ul class="navbar-nav ms-auto after-login" style="display: none;">
          <li class="nav-item"><span class="nav-link" id="navUserName"></span></li>
          <li class="nav-item"><a class="nav-link" href="/html/mypage.html">마이페이지</a></li>
          <li class="nav-item"><a class="nav-link" href="/html/editor.html">글쓰기</a></li>
          <li class="nav-item"><button class="btn btn-outline-light ms-2" id="logoutBtn" type="button">로그아웃</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="py-5 mt-5">
    <div class="container" style="max-width: 760px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-1">계정 설정</h2>
          <p class="text-muted mb-0">이메일을 기준으로 닉네임과 비밀번호 등 개인정보를 관리할 수 있어요.</p>
        </div>
        <a href="/html/mypage.html" class="btn btn-outline-secondary btn-sm">마이페이지로 돌아가기</a>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body">
          <form id="accountSettingsForm" novalidate>
            <div class="mb-3">
              <label for="emailField" class="form-label">이메일</label>
              <input type="email" class="form-control" id="emailField" readonly>
              <div class="form-text">등록된 이메일 계정으로만 정보를 수정할 수 있습니다.</div>
            </div>

            <div class="mb-3">
              <label for="nicknameField" class="form-label">닉네임</label>
              <input type="text" class="form-control" id="nicknameField" placeholder="표시할 닉네임" />
              <div class="form-text">비워두면 이름이 표시됩니다.</div>
            </div>

            <div class="mb-3">
              <label for="bioField" class="form-label">한 줄 소개</label>
              <input type="text" class="form-control" id="bioField" maxlength="100" placeholder="예) 조용히 마음을 적어두는 사람입니다." />
            </div>

            <div class="mb-3">
              <label for="aboutField" class="form-label">자기소개 / 작가 소개</label>
              <textarea class="form-control" id="aboutField" rows="4" placeholder="글을 쓰게 된 계기나 좋아하는 주제 등을 적어보세요."></textarea>
            </div>

            <hr class="my-4" />
            <h5 class="mb-3">비밀번호 변경</h5>

            <div class="mb-3">
              <label for="currentPwField" class="form-label">현재 비밀번호</label>
              <input type="password" class="form-control" id="currentPwField" autocomplete="current-password" />
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label for="newPwField" class="form-label">새 비밀번호</label>
                <input type="password" class="form-control" id="newPwField" autocomplete="new-password" />
              </div>
              <div class="col-md-6">
                <label for="newPwConfirmField" class="form-label">새 비밀번호 확인</label>
                <input type="password" class="form-control" id="newPwConfirmField" autocomplete="new-password" />
              </div>
            </div>

            <div class="d-flex align-items-center gap-3 mt-4">
              <button type="submit" class="btn btn-primary">저장하기</button>
              <span id="accountSettingsMessage" class="small text-muted"></span>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer class="custom-footer">
    <div class="container py-4 py-md-5">
      <div class="row gy-3 align-items-center">
        <div class="col-md-4 text-center text-md-start">
          <div class="footer-brand">글숲</div>
          <p class="footer-subtitle">마음을 나누는 작은 숲</p>
        </div>
        <div class="col-md-4 text-center">
          <ul class="footer-links list-inline mb-0">
            <li class="list-inline-item"><a href="/index.html">홈</a></li>
            <li class="list-inline-item"><a href="/html/mypage.html">마이페이지</a></li>
            <li class="list-inline-item"><a href="/html/editor.html">글쓰기</a></li>
          </ul>
        </div>
        <div class="col-md-4 text-center text-md-end">
          <p class="footer-copy">&copy; 2025 글숲. All rights reserved.</p>
          <p class="footer-small">조용히 머물다 가는 공간을 함께 가꿔요.</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/account-settings.js"></script>
</body>
</html>
