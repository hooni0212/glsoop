<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 글숲</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap"
    rel="stylesheet"
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap"
    rel="stylesheet"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="page-login-preview">
  <main class="login-preview-screen" aria-label="글숲 로그인 화면">
    <canvas
      id="loginPreviewRiveCanvas"
      class="login-preview-canvas"
      data-rive-src="/rive/glsoop_login.riv"
      width="1920"
      height="1080"
      aria-hidden="true"
    ></canvas>

    <div class="login-preview-backdrop" aria-hidden="true"></div>

    <section class="login-preview-card gls-antique-paper gls-antique-paper--mix" aria-labelledby="loginTitle">
      <header class="login-preview-card__head">
        <div class="login-preview-card__brand-row">
          <a href="/index.html" class="login-preview-card__brand" aria-label="홈으로 이동">글숲</a>
          <p class="login-preview-card__eyebrow gls-mb-0">SIGN IN</p>
        </div>
        <h1 id="loginTitle" class="gls-mb-2">다시 돌아오신 걸 환영해요</h1>
        <p class="gls-mb-0 login-preview-card__copy">글숲 계정으로 로그인하고 오늘의 마음을 이어가세요.</p>
      </header>

      <form id="loginForm" class="login-preview-form auth-ui-form" novalidate>
        <div
          id="loginMessage"
          class="gls-feedback gls-feedback--info gls-mb-3"
          role="alert"
          aria-live="polite"
          tabindex="-1"
        ></div>

        <div class="gls-mb-3 auth-field">
          <label class="gls-label" for="loginEmail">이메일</label>
          <input
            id="loginEmail"
            type="email"
            name="email"
            class="gls-input"
            required
            autocomplete="email"
            autofocus
            placeholder="name@example.com"
          >
        </div>

        <div class="gls-mb-3 auth-field">
          <label class="gls-label" for="loginPassword">비밀번호</label>
          <input
            id="loginPassword"
            type="password"
            name="pw"
            class="gls-input"
            required
            autocomplete="current-password"
            placeholder="비밀번호를 입력하세요"
          >
        </div>

        <button type="submit" class="gls-btn gls-btn-primary gls-btn-block">로그인</button>

        <div class="login-preview-links gls-mt-3">
          <a href="/html/forgot-password.html" class="auth-link-inline">비밀번호 찾기</a>
          <a href="/html/signup.html" class="auth-link-inline">회원가입</a>
        </div>
      </form>
    </section>
  </main>

  <div
    class="modal fade login-remember-modal"
    id="rememberLoginModal"
    tabindex="-1"
    aria-labelledby="rememberLoginModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content gls-antique-paper gls-antique-paper--mix">
        <div class="modal-header">
          <h5 class="modal-title" id="rememberLoginModalLabel">자동 로그인 안내</h5>
        </div>
        <div class="modal-body">
          <p class="gls-mb-2">
            이 기기에서 <strong>30일 자동 로그인 유지</strong>가 설정되었습니다.
          </p>
          <p class="gls-text-muted gls-text-small gls-mb-0">
            공용 기기에서는 사용 후 반드시 로그아웃해주세요.
          </p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="gls-btn gls-btn-primary"
            id="rememberLoginConfirmBtn"
            data-gls-autofocus
          >
            확인하고 이동
          </button>
        </div>
      </div>
    </div>
  </div>

  <div
    class="modal fade login-reactivation-modal"
    id="reactivationConfirmModal"
    tabindex="-1"
    aria-labelledby="reactivationConfirmModalLabel"
    aria-hidden="true"
    hidden
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content gls-antique-paper gls-antique-paper--mix">
        <div class="modal-header">
          <h5 class="modal-title" id="reactivationConfirmModalLabel">계정 다시 활성화</h5>
        </div>
        <div class="modal-body">
          <p class="gls-mb-2">
            현재 계정은 비활성화 상태입니다. 계속 진행하면 계정이 다시 활성화되고 로그인됩니다.
          </p>
          <p class="gls-text-muted gls-text-small gls-mb-0" id="reactivationConfirmDeadlineText">
            다시 활성화 전에 한 번 더 확인해드릴게요.
          </p>
        </div>
        <div class="modal-footer login-reactivation-modal__actions">
          <button
            type="button"
            class="gls-btn gls-btn-secondary"
            id="reactivationConfirmCancelBtn"
          >
            여기서 멈추기
          </button>
          <button
            type="button"
            class="gls-btn gls-btn-primary"
            id="reactivationConfirmContinueBtn"
            data-gls-autofocus
          >
            계속 진행
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth-form-utils.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.31.6"></script>
  <script src="/js/login-rive-preview.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
