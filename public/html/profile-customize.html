<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 꾸미기 | 글숲</title>
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="page-profile-customize">
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top nav-height">
    <div class="gls-container">
      <a class="navbar-brand" href="/index.html">글숲</a>
      <button class="navbar-toggler" type="button" data-gls-toggle="nav" aria-controls="navbarNav" aria-expanded="false"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav gls-ms-auto before-login">
          <li class="nav-item"><a class="nav-link" href="/html/login.html">로그인</a></li>
          <li class="nav-item"><a class="nav-link" href="/html/signup.html">회원가입</a></li>
        </ul>
        <ul class="navbar-nav gls-ms-auto after-login is-hidden"></ul>
      </div>
    </div>
  </nav>

  <main class="profile-customize-main AppShell-main">
    <div class="gls-container profile-customize-shell PageContainer">
      <header class="profile-customize-header CardSoft">
        <div>
          <p class="profile-customize-eyebrow">MY PROFILE</p>
          <h1>프로필 꾸미기</h1>
          <p>성장과 퀘스트에서 얻은 배경, 배지, 스티커를 작가 프로필에 배치합니다.</p>
        </div>
        <a class="gls-btn gls-btn-secondary" href="/html/mypage.html">마이페이지로 돌아가기</a>
      </header>

      <div class="profile-customize-grid">
        <aside class="profile-customize-preview CardSoft" aria-label="프로필 미리보기">
          <div id="profileCustomizePreview"><p class="gls-text-muted gls-mb-0">미리보기를 준비하는 중입니다...</p></div>
        </aside>

        <section class="profile-customize-editor CardSoft" id="profileCustomizeEditor" aria-live="polite" aria-busy="true">
          <p class="profile-customize-state">보유한 꾸미기 아이템을 불러오는 중입니다...</p>
        </section>
      </div>
    </div>
  </main>

  <div class="profile-customize-save-dock">
    <div>
      <strong id="profileCustomizeSaveState">저장됨</strong>
      <span id="profileCustomizeSaveHint">변경할 아이템을 선택하세요.</span>
    </div>
    <button class="gls-btn gls-btn-primary" id="profileCustomizeSave" type="button" disabled>변경사항 저장</button>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/header.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/profile-customize.js"></script>
</body>
</html>
