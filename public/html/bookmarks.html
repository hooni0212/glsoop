<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글숲 - 북마크</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/themes/spring-theme.css">
  <link rel="stylesheet" href="/css/themes/summer-theme.css">
  <link rel="stylesheet" href="/css/themes/autumn-theme.css">
  <link rel="stylesheet" href="/css/themes/winter-theme.css">
</head>
<body class="winter-theme page-bookmarks">
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top nav-height">
    <div class="container">
      <a class="navbar-brand" href="/index.html">글숲</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-lg-3 category-dropdown-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="categoryDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">카테고리</a>
            <ul class="dropdown-menu nav-category-menu" aria-labelledby="categoryDropdown">
              <li><a class="dropdown-item nav-category-item" href="/index.html">전체</a></li>
              <li><a class="dropdown-item nav-category-item" href="/html/category.html?category=poem">시</a></li>
              <li><a class="dropdown-item nav-category-item" href="/html/category.html?category=essay">에세이/일기</a></li>
              <li><a class="dropdown-item nav-category-item" href="/html/category.html?category=short">짧은 구절</a></li>
            </ul>
          </li>
        </ul>
        <ul class="navbar-nav ms-auto before-login">
          <li class="nav-item"><a class="nav-link" href="/html/login.html">로그인</a></li>
          <li class="nav-item"><a class="nav-link" href="/html/signup.html">회원가입</a></li>
        </ul>
        <ul class="navbar-nav ms-auto after-login" style="display:none;">
          <li class="nav-item"><span class="nav-link" id="navUserName"></span></li>
          <li class="nav-item"><a class="nav-link" href="/html/mypage.html">마이페이지</a></li>
          <li class="nav-item"><a class="nav-link" href="/html/editor.html">글쓰기</a></li>
          <li class="nav-item"><button class="btn btn-outline-light ms-2" id="logoutBtn" type="button">로그아웃</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="page-section">
    <div class="container bookmarks-shell">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <p class="text-muted mb-1">내 북마크 폴더</p>
          <h3 class="mb-0">북마크</h3>
        </div>
        <button class="btn btn-outline-primary" id="createListBtn">+ 새 폴더</button>
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="bookmark-panel">
            <ul class="list-group" id="bookmarkLists"></ul>
          </div>
        </div>
        <div class="col-md-8">
          <div class="bookmark-panel" id="bookmarkContent">
            <p class="text-muted">폴더를 선택하면 저장된 글을 볼 수 있습니다.</p>
            <div id="bookmarkPosts"></div>
            <div class="d-grid mt-3" id="bookmarkLoadMoreWrap" style="display:none;">
              <button class="btn btn-outline-secondary" id="bookmarkLoadMore">더 보기</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="listFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="listFormTitle">새 폴더 만들기</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="listNameInput" class="form-label">폴더 이름</label>
            <input type="text" class="form-control" id="listNameInput" maxlength="80" required>
          </div>
          <div class="mb-3">
            <label for="listDescInput" class="form-label">설명 (선택)</label>
            <textarea class="form-control" id="listDescInput" rows="2"></textarea>
          </div>
          <input type="hidden" id="listEditId" value="">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-primary" id="saveListBtn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/postCard.js"></script>
  <script src="/js/bookmarkModal.js"></script>
  <script src="/js/bookmarks.js"></script>
</body>
</html>
