<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>탐색으로 이동 중 | 글숲</title>
</head>
<body>
  <script>
    (function redirectToExplore() {
      var params = new URLSearchParams(window.location.search || '');
      var next = new URL('/explore', window.location.origin);
      var category = String(params.get('category') || '').trim();
      if (category) {
        next.searchParams.set('category', category);
      }
      window.location.replace(next.toString());
    })();
  </script>
  <p>탐색 페이지로 이동 중입니다...</p>
</body>
</html>
