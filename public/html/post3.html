<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글숲 - 읽기 시안</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages/post3.css">
</head>
<body class="page-post3">
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top nav-height">
    <div class="gls-container">
      <a class="navbar-brand" href="/index.html">글숲</a>
      <button class="navbar-toggler" type="button" data-gls-toggle="nav" aria-controls="navbarNav" aria-expanded="false">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav gls-ms-auto before-login">
          <li class="nav-item"><a class="nav-link" href="/html/login.html">로그인</a></li>
          <li class="nav-item"><a class="nav-link" href="/html/signup.html">회원가입</a></li>
        </ul>
        <ul class="navbar-nav gls-ms-auto after-login is-hidden">
          <li class="nav-item"><span class="nav-link" id="navUserName"></span></li>
          <li class="nav-item"><a class="nav-link" href="/html/mypage.html">마이페이지</a></li>
          <li class="nav-item"><a class="nav-link" href="/html/editor3.html">글쓰기 시안</a></li>
          <li class="nav-item">
            <button class="user-profile" id="logoutBtn" type="button" aria-label="로그아웃">
              <span class="user-profile-inner">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                  <g data-name="Layer 2" id="Layer_2">
                    <path d="m15.626 11.769a6 6 0 1 0 -7.252 0 9.008 9.008 0 0 0 -5.374 8.231 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 9.008 9.008 0 0 0 -5.374-8.231zm-7.626-4.769a4 4 0 1 1 4 4 4 4 0 0 1 -4-4zm10 14h-12a1 1 0 0 1 -1-1 7 7 0 0 1 14 0 1 1 0 0 1 -1 1z"></path>
                  </g>
                </svg>
                <span class="user-profile-label">로그아웃</span>
              </span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="post3-shell gls-mt-5 gls-py-5">
    <div class="gls-container">
      <header class="post3-hero">
        <div class="post3-hero__copy">
          <p class="post3-kicker">GLSOOP READER</p>
          <h1 class="post3-title" id="post3Title">오늘의 글</h1>
          <p class="post3-description" id="post3Description">카드의 호흡을 따라 차분하게 읽을 수 있는 읽기 시안입니다.</p>
        </div>
        <div class="post3-hero__meta" id="post3HeroMeta">
          <span class="post3-chip" id="post3CategoryChip">한 구절</span>
          <span class="post3-chip"><strong id="post3PageCount">1</strong>장</span>
          <span class="post3-chip" id="post3DateChip">불러오는 중</span>
        </div>
      </header>

      <div class="post3-grid">
        <main class="post3-main">
          <section class="post3-reader">
            <div class="post3-reader__head">
              <div class="post3-reader__mode">
                <button type="button" class="post3-pill is-active" data-read-mode="cards">카드로 읽기</button>
                <button type="button" class="post3-pill" data-read-mode="linear">이어 읽기</button>
              </div>
              <div class="post3-reader__status">
                <span class="post3-chip"><span id="post3CurrentPage">1</span> / <span id="post3CurrentTotal">1</span></span>
              </div>
            </div>

            <div class="post3-feedback" id="post3Feedback"></div>

            <div id="post3CardsView" class="post3-cards-view">
              <button type="button" id="post3PrevBtn" class="post3-nav-btn" aria-label="이전 페이지">
                <span aria-hidden="true">‹</span>
              </button>
              <div class="post3-stage-window">
                <div id="post3Stage" class="post3-stage"></div>
              </div>
              <button type="button" id="post3NextBtn" class="post3-nav-btn" aria-label="다음 페이지">
                <span aria-hidden="true">›</span>
              </button>
            </div>

            <div id="post3LinearView" class="post3-linear-view" hidden></div>
            <div id="post3Thumbs" class="post3-thumbs"></div>
          </section>

          <section class="post3-meta-card">
            <div class="post3-author" id="post3Author">글쓴이를 불러오는 중입니다.</div>
            <div class="post3-meta-row" id="post3MetaRow"></div>
            <div class="post3-tags" id="post3Tags"></div>
          </section>
        </main>

        <aside class="post3-side">
          <div class="post3-side-card">
            <h2 class="post3-side-title">반응</h2>
            <div class="post3-actions">
              <button id="post3LikeBtn" type="button" class="post3-action-btn" aria-label="좋아요">
                <span class="post3-action-btn__label">좋아요</span>
                <span id="post3LikeCount">0</span>
              </button>
              <button id="post3BookmarkBtn" type="button" class="post3-action-btn" aria-label="북마크">북마크</button>
              <button id="post3ShareBtn" type="button" class="post3-action-btn" aria-label="공유">공유</button>
              <button id="post3SafetyBtn" type="button" class="post3-action-btn" aria-label="더보기 메뉴">더보기</button>
            </div>
            <a class="post3-link" id="post3LegacyLink" href="#">기존 post 화면 보기</a>
          </div>

          <div class="post3-side-card">
            <div class="post3-side-head">
              <h2 class="post3-side-title">관련 글</h2>
            </div>
            <div id="post3RelatedHighlight" class="post3-related-highlight">
              <p class="gls-text-muted gls-text-small gls-mb-0">관련 글을 불러오는 중입니다...</p>
            </div>
            <div id="post3RelatedList" class="post3-related-list"></div>
          </div>
        </aside>
      </div>

      <div id="post3ProxyCardMount" hidden></div>
    </div>
  </section>

  <footer class="custom-footer">
    <div class="gls-container">
      <div class="gls-flex gls-flex-col gls-gap-2 gls-items-center gls-text-center gls-md-flex-row gls-justify-between">
        <div class="footer-left gls-text-md-start">
          <div class="footer-brand">글숲</div>
          <p class="footer-subtitle gls-mb-0">마음을 나누는 작은 숲</p>
        </div>
        <div class="footer-right gls-text-md-end footer-meta">
          <p class="footer-copy gls-mb-1">조용히 머물다 가는 공간을 함께 가꿔요.</p>
          <p class="footer-small gls-mb-0">&copy; 2025 글숲</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/seasonal.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/header.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/postCard.js"></script>
  <script src="/js/bookmarkModal.js"></script>
  <script src="/js/readingMode.js"></script>
  <script src="/js/cardRenderer.js"></script>
  <script src="/js/post3.js"></script>
</body>
</html>
